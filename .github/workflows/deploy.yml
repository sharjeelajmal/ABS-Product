name: Pro Deploy to Hostinger

on:
  push:
    branches:
      - main # Jab main branch par push hoga, yeh chalega

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Code Download
        uses: actions/checkout@v3

      - name: ⚙️ Node.js Setup
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Next.js ke liye required naya engine

      - name: 📦 Packages Install
        run: npm install

      - name: 🔨 Website Build
        run: npm run build

      - name: 🚀 SSH se Pakka Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "out/" # Sirf tayar shuda files
          target: "/home/u483648284/domains/aurabusinesssolution.com/public_html/pk" # Exact rasta, bina kisi extra space ke
          strip_components: 1 # Yeh out folder ko nahi, balki uske andar ke saman ko bhejega
