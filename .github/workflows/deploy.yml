name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Code Download
        uses: actions/checkout@v3

      - name: ⚙️ Node.js Setup
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: 📦 Packages Install
        run: npm install

      - name: 🔨 Website Build
        run: npm run build

      - name: 🚀 FTP se Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /domains/aurabusinesssolution.com/public_html/pk/
          dangerous-clean-slate: true # Yeh purani files ko clear kar ke nayi files rakhega
