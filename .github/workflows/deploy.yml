name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Code Download
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 🗄️ Cache node_modules
        # (5) Caching (Optimization): Caching ~/.npm directory to speed up npm install
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Packages Install
        run: npm install

      - name: 🔨 Website Build
        run: npm run build

      - name: 🚀 FTP se Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # (1) Fix Variable Mismatch: strictly use FTP_SERVER secret
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          # (2) Secure the Target Directory: absolute path on Hostinger
          server-dir: ./
          # (3) Safe Clean Slate: Retained to clear the folder before uploading
          dangerous-clean-slate: true

# Done
